name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Microsoft.Graph.Authentication -Scope CurrentUser -Force
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -MinimumVersion 1.21 -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path .\EntraHunt -Recurse -ExcludeRule PSAvoidUsingWriteHost
          $errors = @($results | Where-Object Severity -eq 'Error')
          if ($results.Count -gt 0) { $results | Format-Table }
          if ($errors.Count -gt 0) { exit 1 }

      - name: Run Pester Tests
        shell: pwsh
        run: |
          Invoke-Pester -CI
